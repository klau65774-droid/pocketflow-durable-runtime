[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketflow-durable-runtime"
version = "0.1.0"
description = "Durable, concurrency-safe, OTel-observable, and trajectory-evaluated runtime upgrading The-Pocket/PocketFlow"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pocketflow_runtime*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["backend/upstream_baseline", "upstream_baseline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["backend"]
strict = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_reexport = true
exclude = ["upstream_baseline", "backend/upstream_baseline"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
asyncio_mode = "auto"
